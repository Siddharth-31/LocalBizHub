
services:
  postgres:
    image: postgres:16-alpine
    container_name: localbizhub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: localbizhub
      POSTGRES_USER: localbizuser
      POSTGRES_PASSWORD: localdevpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localbizuser -d localbizhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - localbizhub-network

  backend:
    build:
      context: ./backend
    container_name: localbizhub-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: localbizhub
      DB_USER: localbizuser
      DB_PASSWORD: localdevpassword
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - localbizhub-network

  nginx:
    build:
      context: ./frontend
    container_name: localbizhub-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - localbizhub-network

volumes:
  postgres_data:

networks:
  localbizhub-network:
    driver: bridge
